        // ==========================================================================
        // SCROLL REVEAL & COUNTERS
        // ==========================================================================
        function initScrollObserver() {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        
                        // Trigger counters if inside a stats section
                        if (entry.target.classList.contains('stats-grid')) {
                            startCounters();
                        }
                        
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.scroll-reveal').forEach(el => {
                observer.observe(el);
            });
        }

        function startCounters() {
            const counters = document.querySelectorAll('.counter');
            const speed = 200;

            counters.forEach(counter => {
                const updateCount = () => {
                    const target = +counter.getAttribute('data-target');
                    const count = +counter.innerText.replace(/,/g, '');
                    const format = counter.getAttribute('data-format');
                    
                    const inc = target / speed;

                    if (count < target) {
                        let current = Math.ceil(count + inc);
                        if(format === 'm' && target === 1000000) {
                             counter.innerText = '1';
                             return;
                        } else {
                             counter.innerText = current.toLocaleString();
                        }
                        setTimeout(updateCount, 15);
                    } else {
                        if(format === 'm' && target >= 1000000) {
                             counter.innerText = (target / 1000000);
                        } else {
                             counter.innerText = target.toLocaleString();
                        }
                    }
                };
                updateCount();
            });
        }

        function initFAQ() {
            const faqItems = document.querySelectorAll('.faq-item');
            faqItems.forEach(item => {
                const question = item.querySelector('.faq-question');
                question.addEventListener('click', () => {
                    const isActive = item.classList.contains('active');
                    
                    // Close all
                    faqItems.forEach(faq => {
                        faq.classList.remove('active');
                        faq.querySelector('.faq-answer').style.maxHeight = null;
                    });
                    
                    // Open clicked if it wasn't active
                    if (!isActive) {
                        item.classList.add('active');
                        const answer = item.querySelector('.faq-answer');
                        answer.style.maxHeight = answer.scrollHeight + "px";
                    }
                });
            });
        }

        function populateFooter() {
            document.getElementById('footerEmail').innerHTML = `<a href="mailto:${BUSINESS_CONFIG.email}">${BUSINESS_CONFIG.email}</a>`;
            document.getElementById('footerIg').innerHTML = `<a href="${BUSINESS_CONFIG.instagramUrl}" target="_blank">${BUSINESS_CONFIG.instagram}</a>`;
        }

        // ==========================================================================
        // MODALS & FORM LOGIC
        // ==========================================================================
        function openModal(packageId) {
            const modal = document.getElementById('enquiryModal');
            const packageInput = document.getElementById('formPackage');
            const packageDataInput = document.getElementById('formPackageData');
            
            // Reset state
            goBackToStep1();
            document.getElementById('enquiryForm').reset();
            document.getElementById('paymentError').style.display = 'none';

            if (packageId === 'custom') {
                packageInput.value = "CUSTOM CAMPAIGN";
                packageDataInput.value = JSON.stringify({ name: "CUSTOM CAMPAIGN", price: "Custom", custom: true });
            } else {
                const pkg = PACKAGES_DATA.find(p => p.id === packageId);
                if (pkg) {
                    packageInput.value = `${pkg.name} — $${pkg.price}`;
                    packageDataInput.value = JSON.stringify(pkg);
                }
            }

            modal.classList.add('active');
            document.body.classList.add('modal-open');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            document.body.classList.remove('modal-open');
        }

        function closeAllModals() {
            document.querySelectorAll('.modal-overlay').forEach(modal => {
                modal.classList.remove('active');
            });
            document.body.classList.remove('modal-open');
        }

        function goBackToStep1() {
            document.getElementById('step-1-content').style.display = 'block';
            document.getElementById('step-2-content').style.display = 'none';
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            
            // Validation
            const paymentRadios = document.getElementsByName('paymentMethod');
            let selectedPayment = null;
            for (let radio of paymentRadios) {
                if (radio.checked) selectedPayment = radio.value;
            }
            
            if (!selectedPayment) {
                document.getElementById('paymentError').style.display = 'block';
                return;
            }
            document.getElementById('paymentError').style.display = 'none';

            // Gather Data
            const name = document.getElementById('formName').value;
            const email = document.getElementById('formEmail').value;
            const ig = document.getElementById('formIg').value;
            const social = document.getElementById('formSocial').value || 'None provided';
            const desc = document.getElementById('formDesc').value;
            const remarks = document.getElementById('formRemarks').value || 'None provided';
            
            const pkgRaw = document.getElementById('formPackageData').value;
            const pkgData = JSON.parse(pkgRaw);

            // Construct Email Body
            const subjectTitle = pkgData.custom ? 'Custom Campaign' : pkgData.name;
            const subject = `New Campaign Enquiry — ${subjectTitle}`;
            
            let bodyData = `THE CHEF'S WORLD\r\nNEW CAMPAIGN ENQUIRY\r\n\r\n`;
            bodyData += `Name: ${name}\r\nEmail: ${email}\r\nInstagram Username: ${ig}\r\nSocial Media Links: ${social}\r\n`;
            
            if (pkgData.custom) {
                bodyData += `Selected Package: CUSTOM CAMPAIGN\r\n`;
            } else {
                bodyData += `Selected Package: ${pkgData.name}\r\nPrice: $${pkgData.price}\r\nCampaign Duration: ${pkgData.duration}\r\n`;
                bodyData += `Feed Posts: ${pkgData.posts}\r\nStory Features: ${pkgData.stories}\r\nReel Promotions: ${pkgData.reels}\r\n`;
                bodyData += `Estimated Campaign Target: ${pkgData.target}\r\n`;
            }

            bodyData += `\r\nBusiness / Profile Description:\r\n${desc}\r\n\r\n`;
            bodyData += `Campaign Remarks / Creative Direction:\r\n${remarks}\r\n\r\n`;
            bodyData += `Preferred Payment Method: ${selectedPayment}\r\n`;

            generatedMailtoLink = `mailto:${BUSINESS_CONFIG.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyData)}`;

            // Transition to Step 2
            document.getElementById('step-1-content').style.display = 'none';
            document.getElementById('step-2-content').style.display = 'block';
            
            // Scroll modal to top
            document.querySelector('#enquiryModal .modal-content').scrollTop = 0;
        }

        function executeMailto() {
            if (generatedMailtoLink) {
                window.location.href = generatedMailtoLink;
                // Keep modal open so they can go back if email client fails, but normally it just opens the client.
            }
        }

        // ==========================================================================
        // OTHER EMAIL FUNCTIONS
        // ==========================================================================
        function sendContentEmail() {
            const subject = "Content Submission — The Chef's World";
            const body = `Hello The Chef's World,\r\n\r\nI would like to submit content for promotion.\r\n\r\nName: \r\nInstagram Username: \r\nSelected Package: \r\n\r\nContent Notes:\r\n[Please add any specific instructions here]\r\n\r\nI have attached the photographs/videos to this email.\r\n\r\nRegards,`;
            window.location.href = `mailto:${BUSINESS_CONFIG.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }

        function openContactEmail() {
            window.location.href = `mailto:${BUSINESS_CONFIG.email}`;
        }

        // ==========================================================================
        // LEGAL MODALS
        // ==========================================================================
        function openLegalModal(type, event) {
            event.preventDefault();
            const modal = document.getElementById('legalModal');
            const title = document.getElementById('legalTitle');
            const body = document.getElementById('legalBody');

            if (type === 'privacy') {
                title.innerText = "Privacy Policy";
                body.innerHTML = `
                    <p style="margin-bottom:1rem;"><strong>Information Collection:</strong> We collect only the information provided voluntarily via our enquiry email system (name, email, social media handles, and business descriptions) for the sole purpose of organizing your promotional campaign.</p>
                    <p style="margin-bottom:1rem;"><strong>Data Usage:</strong> Your information is used strictly to communicate regarding services, confirm payment preferences, and execute social media promotion.</p>
                    <p style="margin-bottom:1rem;"><strong>Third Parties:</strong> We do not sell, trade, or distribute your personal data or payment preferences to unauthorized third parties.</p>
                    <p><strong>Security:</strong> All communication happens directly via secure email clients. We do not ask for or store passwords to your social media accounts, nor do we process payments directly on this website.</p>
                `;
            } else if (type === 'terms') {
                title.innerText = "Terms & Conditions";
                body.innerHTML = `
                    <p style="margin-bottom:1rem;"><strong>Services Provided:</strong> The Chef's World provides coordinated social media exposure. Campaign targets represent the audience-growth commitment associated with the selected package.</p>
                    <p style="margin-bottom:1rem;"><strong>No Guarantees of Revenue:</strong> Actual performance, engagement rates, sales, restaurant bookings, and revenue are not guaranteed and depend entirely on content quality, audience reception, and third-party platform algorithms.</p>
                    <p style="margin-bottom:1rem;"><strong>Content Rights:</strong> By submitting photographs, videos, or Reels to our team, you confirm that you own the rights to the media and grant us permission to post it across our network for the duration of the campaign.</p>
                    <p><strong>Payment:</strong> Payment must be cleared via agreed third-party platforms (PayPal, Venmo, Zelle, or Cash App) prior to the commencement of the campaign schedule.</p>
                `;
            }

            modal.classList.add('active');
            document.body.classList.add('modal-open');
        }

    </script>
</body>
</html>
